services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: opspilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:${POSTGRES_PASSWORD:-opspilot}@db:5432/opspilot
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_FOR_LOCAL_DEMO_ONLY}
      DEMO_MODE: ${DEMO_MODE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:5173"]
volumes:
  postgres_data:
